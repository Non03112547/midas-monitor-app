[package]
name = "md-monitor"
version = "1.1.0"
description = "MD Monitor - Real-time Desktop Hardware & Telemetry OSD"
authors = ["Midas Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"
nvml-wrapper = "0.10"
windows = { version = "0.52.0", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
tokio = { version = "1", features = ["full"] }
libloading = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
