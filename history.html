<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ประวัติการใช้งานรายวัน - MD Monitor</title>
  <link rel="stylesheet" href="/src/history.css" />
</head>
<body>
  <div class="history-shell">
    <header class="history-header">
      <div class="header-title-group">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
          <path d="M3 3v5h5" />
          <path d="M12 7v5l4 2" />
        </svg>
        <div>
          <h1 id="page-title">ประวัติการใช้งานรายวัน</h1>
          <p id="page-subtitle" class="subtitle">บันทึกค่าเฉลี่ยรายวันและการใช้ไฟสะสมตั้งแต่วันแรกที่ใช้งาน</p>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" id="btn-refresh" class="btn-ctrl">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
            <path d="M16 16h5v5" />
          </svg>
          <span id="txt-btn-refresh">รีเฟรช</span>
        </button>
        <button type="button" id="btn-clear" class="btn-ctrl btn-danger">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18" />
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
          </svg>
          <span id="txt-btn-clear">ล้างประวัติ</span>
        </button>
      </div>
    </header>

    <section class="summary-grid">
      <div class="summary-card">
        <span id="lbl-first-used" class="summary-label">เริ่มใช้งานครั้งแรก</span>
        <span id="val-first-used" class="summary-value">--</span>
      </div>
      <div class="summary-card">
        <span id="lbl-total-days" class="summary-label">จำนวนวันทั้งหมด</span>
        <span id="val-total-days" class="summary-value">0 วัน</span>
      </div>
      <div class="summary-card">
        <span id="lbl-total-time" class="summary-label">เวลารวมทั้งหมด</span>
        <span id="val-total-time" class="summary-value">0 วินาที</span>
      </div>
      <div class="summary-card highlight">
        <span id="lbl-total-energy" class="summary-label">การใช้ไฟสะสมรวม</span>
        <span id="val-total-energy" class="summary-value">0.0 Wh</span>
      </div>
    </section>

    <main class="daily-list-container">
      <div id="daily-list" class="daily-list"></div>
    </main>
  </div>

  <script type="module" src="/src/history.ts"></script>
</body>
</html>
